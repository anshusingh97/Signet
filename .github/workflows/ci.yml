name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Compile and build contract
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0 || compact update
          cd preprod-deployment
          npm install
          cd contracts
          compact compile src/bboard.compact ./src/managed/bboard
          npm run build

      - name: Commit Compiled Contract to Repo
        run: |
          git config --global user.name "anshusingh97"
          git config --global user.email "anshusingh97@users.noreply.github.com"
          git add -f preprod-deployment/contracts/dist preprod-deployment/contracts/src/managed
          git commit -m "Auto-compile and update contract bindings" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
